# Judge0 configuration for the local code-execution stack (ADR-018).
# Loaded via env_file in docker-compose.yml by every Judge0 service:
#   - judge0-server / judge0-workers read REDIS_* / POSTGRES_* (Rails + Resque config)
#   - judge0-db / judge0-redis read POSTGRES_* / REDIS_PASSWORD
#
# DEV ONLY. These are local throwaway credentials — a real deployment must
# supply its own values (see ADR-018). Never reuse this file outside local dev.

# Return the submission result synchronously on the /submissions call when
# wait=true, so the spike can POST code and read stdout in one round-trip.
ENABLE_WAIT_RESULT=true

# --- PostgreSQL (Judge0's own database, isolated from the app database) ---
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_dev

# --- Redis ---
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0_redis_dev
