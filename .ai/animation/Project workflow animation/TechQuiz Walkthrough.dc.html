<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #17121f; }
</style>
</helmet>
<div style="position: fixed; inset: 0; background: #17121f;">
  <x-import component-from-global-scope="TechQuizScene" from="./animations.jsx ./techquiz-scene.jsx" accent="{{ accent }}" show-captions="{{ showCaptions }}" show-architecture="{{ showArchitecture }}" show-cursor="{{ showCursor }}" hint-size="100%,100%"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot;},
  &quot;accent&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Violet → Amber&quot;, &quot;options&quot;: [&quot;Violet → Amber&quot;, &quot;Violet&quot;, &quot;Teal&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Look&quot;},
  &quot;showCursor&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;showCaptions&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;},
  &quot;showArchitecture&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot;}
}">
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? 'Violet → Amber',
      showCaptions: this.props.showCaptions ?? true,
      showArchitecture: this.props.showArchitecture ?? true,
      showCursor: this.props.showCursor ?? true,
    };
  }
}
</script>
</body>
</html>
